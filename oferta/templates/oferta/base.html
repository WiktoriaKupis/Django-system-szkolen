<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>System szkoleń</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 40px;
        }

        nav {
            background: #333;
            padding: 15px;
            margin-bottom: 30px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        input, select, textarea {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Start</a>
    <a href="/offer/">Oferta publiczna</a>
    <a href="/offer-mng/">Panel oferty</a>
    <a href="/admin/">Admin</a>
    <a href="/api/categories/">API Kategorie</a>
    <a href="/api/courses/">API Szkolenia</a>
</nav>

<div class="box">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
